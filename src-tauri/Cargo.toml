[package]
name = "opencode-gui"
version = "0.1.0"
description = "Lightweight GUI client for opencode serve"
authors = ["you"]
edition = "2021"

# OS glass (acrylic, matching the old config-level ["acrylic", "mica"]) is on
# by default — the Windows 10 build opts out:
#   cargo tauri build --features noglass
[features]
noglass = []

# faster rebuilds when switching build variants (win10/win11) and small edits
[profile.release]
incremental = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oc_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
notify = "7"
zip = { version = "4", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.9.0"
base64 = "0.23.1"
sha2 = "0.10"

[target."cfg(windows)".dependencies]
window-vibrancy = "0.6"

